[project]
name = "desafio-ia"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.53",
    "httpx>=0.28",
    "pydantic-settings>=2.15",
    "pyyaml>=6.0",
]
[dependency-groups]
dev = [
    "pytest>=9.1",
    "anyio>=4.15",
    "httpx2>=2.13.1",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests", "evals"]

[tool.uv]
package = false
