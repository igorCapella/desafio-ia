    descricao: Classe diferente — alimentos
    critico: false
    conversa: ["Resuma o processo 0000002-88.2026.8.99.9002."]
    espera:
      fatos: ["alimentos"]
      ferramentas: ["obter_dossie"]
      sem_alerta: ["citacao"]
    gabarito:
      - {sql: "select classe from v_processo where numero='0000002-88.2026.8.99.9002'", espera: "Ação de Alimentos"}

  - id: C25
    descricao: Busca por CPF digitado pelo usuário
    critico: false
    conversa: ["Quais processos têm como parte o CPF 999.550.862-21?"]
    espera:
      fatos: ["0000001-15.2022.8.99.9012"]
      ferramentas: ["buscar_processos"]
      sem_alerta: ["dados_pessoais"]
    gabarito:
