    espera:
      fatos: ["16/09/2024 | 2024-09-16", "04/09/2024 | 2024-09-04"]
      ferramentas: ["obter_dossie"]
    gabarito:
      - {sql: "select data_juntada from v_documentos where id=16", espera: "2024-09-04"}

  - id: C23
