name: testes
on: [push, pull_request]
permissions:
  contents: read
jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"
      - run: uv sync --locked
      # tests/ e o smoke das avaliações (gabaritos conferidos no banco, sem chamar a API)
      - run: uv run pytest -q
